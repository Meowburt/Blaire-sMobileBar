<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaire's Mobile Bar</title>
    <style>
        /* Removes all white borders and margins */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; 
            background-color: #fcbcd4; /* Matches your pink theme while loading */
        }
        /* Forces the Canva site to fill the entire screen */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- This is your specific Canva embed link -->
    <iframe src="https://www.canva.com/design/DAHVR4D6l2k/Svm894b4ch9reb34g3dswg/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
</body>
</html>
